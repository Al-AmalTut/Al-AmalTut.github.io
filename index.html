<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Amal Tutoring Centre</title>
<meta name="description" content="Al Amal Tutoring Centre — registration for the 2026/2027 scholastic year.">

<!-- Shown when the link is shared on WhatsApp, so parents see a proper card
     instead of a bare URL. -->
<meta property="og:title" content="Al Amal Tutoring Centre">
<meta property="og:description" content="Register for the 2026/2027 scholastic year.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2A4A; --paper:#FBFAF8; --card:#FFFFFF; --rule:#D8DEE9;
  --grid:#E9EDF4; --graphite:#5C6472;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --serif:"Newsreader",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--sans); color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  display:grid; place-items:center; padding:28px 16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
.card{
  background:var(--card); border:1px solid var(--rule); border-radius:12px;
  box-shadow:0 1px 2px rgba(27,42,74,.05), 0 10px 30px -14px rgba(27,42,74,.22);
  max-width:440px; width:100%; padding:34px 26px 28px; text-align:center;
}
.ar{font-family:"IBM Plex Sans Arabic",var(--sans);font-size:15px;color:var(--graphite);margin:0 0 4px}
h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 8px}
.yr{font-size:14px;color:var(--graphite);margin:0 0 26px}
.rule{height:1px;background:var(--rule);margin:0 0 24px}
a.btn{
  display:block; padding:15px 18px; margin-bottom:10px;
  font-size:16px; font-weight:500; text-decoration:none;
  color:#fff; background:var(--ink); border:1px solid var(--ink); border-radius:9px;
}
a.btn:hover{background:#132038}
a.btn.quiet{color:var(--ink); background:var(--card); border-color:var(--rule)}
a.btn.quiet:hover{border-color:var(--ink)}
a.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sub{font-size:13px;color:var(--graphite);margin:18px 0 0}
.sub a{color:var(--ink)}
</style>
</head>
<body>
  <main class="card">
    <p class="ar">مركز الأمل التعليمي</p>
    <h1>Al Amal Tutoring Centre</h1>
    <p class="yr">Scholastic year 2026 / 2027</p>
    <div class="rule"></div>

    <a class="btn" href="register/">Register for this year</a>

    <!-- Add the fees page here once it exists:
    <a class="btn quiet" href="fees/">See the fees</a>
    -->

    <p class="sub">Questions? Call <a href="tel:+96171290830">+961 71 290 830</a></p>
  </main>
</body>
</html>
